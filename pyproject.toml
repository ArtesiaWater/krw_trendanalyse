[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krw_trendanalyse"
version = "0.2.0"
description = "Trendanalyse voor grondwaterkwantiteit voor de Kader Richtlijn Water (KRW)."
readme = "README.md"
authors = [
    { name = "Davíd Brakenhoff", email = "d.brakenhoff@artesia-water.nl" },
    { name = "Ruben Caljé", email="r.calje@artesia-water.nl" },
    { name = "Martin Vonk", email="m.vonk@artesia-water.nl" },
]
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "matplotlib", "pastas<2.0"]

[project.urls]
homepage = "https://github.com/ArtesiaWater/krw_trendanalyse"
repository = "https://github.com/ArtesiaWater/krw_trendanalyse"

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-design",
    "sphinx-rtd-theme",
    "numpydoc",
    "myst_nb",
    "sphinx-autoapi",
]

[tool.ruff]
extend-include = ["*.ipynb"]
lint.extend-select = ["I"]
show-fixes = true
fix = true
